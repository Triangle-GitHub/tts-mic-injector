# TTS Mic Injector —— 虚拟麦克风（Linux 侧对应 Windows 的 VB-Cable）
#
# 装到 ~/.config/pipewire/pipewire.conf.d/51-tts-mic.conf（platforms/linux/install.sh 会做）
#
# 1) ttsmic_out：常驻 null sink，应用把 TTS 音频播到这里
# 2) libpipewire-module-loopback：把它 monitor 接到一个虚拟 source
#    ★ stream.capture.sink = true 是关键 —— 没有它 capture 流不会去抓 monitor，
#      设备建得出来、pactl 也看得见，但 source 上一条 link 都没有，录回来是静音。
# 3) ttsmic_src：任何程序都能把它当麦克风选（显示名 TTS Mic）
#
# 判据：
#   pactl list short sources | grep ttsmic_src
#   pw-cli ls Link | grep -c ttsmic        # 播着东西时应该有 link
# 撤销：删掉本文件后 systemctl --user restart pipewire pipewire-pulse wireplumber

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = ttsmic_out
            node.description = "TTS Mic Sink"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            object.linger    = true
        }
    }
]

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            audio.position = [ FL FR ]
            node.group     = ttsmic
            capture.props = {
                node.target         = ttsmic_out
                stream.capture.sink = true
            }
            playback.props = {
                media.class      = Audio/Source
                node.name        = ttsmic_src
                node.description = "TTS Mic"
                audio.channels   = 2
                audio.position   = [ FL FR ]
            }
        }
    }
]
